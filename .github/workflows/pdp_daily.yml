# GA4 + 상세페이지 버전 감지.  Clarity와 달리 시각에 민감하지 않다.
#
# GA4는 수집 후 약 48시간 동안 수치가 확정되므로 매 실행마다 최근 4일을 다시 받아 덮어쓴다.
# (Clarity는 append-only — 두 규칙이 정반대인 점을 fetch_ga4_pdp.py 상단에 적어두었다.)
#
# 카페24는 여기 없다. refresh 토큰이 쓸 때마다 교체되는 방식이라 Actions와 로컬이 동시에
# 토큰을 쓰면 깨진다. 카페24는 로컬 collect_pdp.bat 전용이다.
name: pdp daily

on:
  schedule:
    - cron: "20 22 * * *"     # 22:20 UTC = 07:20 KST
  workflow_dispatch:
  push:
    paths:
      - "data/cafe24_pdp_history.json"   # 로컬이 카페24 수집분을 push하면 이어서 돈다

concurrency:
  group: pdp-daily
  cancel-in-progress: false

permissions:
  contents: write   # 수집 결과를 커밋한다. 없으면 push 단계가 403.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        # google-auth 만으로는 부족하다. 서비스계정 토큰 갱신에 쓰는
        # google.auth.transport.requests 가 requests 를 따로 요구하는데, 그게 없으면
        # ImportError 가 나면서 "google-auth 가 필요합니다"라는 엉뚱한 메시지로 죽는다.
        # 로컬에는 requests 가 이미 깔려 있어서 드러나지 않았다.
        run: pip install -r requirements.txt

      - name: Fetch GA4
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: python fetch_ga4_pdp.py

      - name: Detect detail-page versions
        run: python detect_version.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # docs/ 는 대시보드 생성 전까지 존재하지 않는다. 두 경로를 한 번에 add 하면
          # 없는 쪽 때문에 명령 전체가 실패하고, || true 가 그 실패를 삼켜서
          # data/ 까지 스테이징되지 않는다 — 수집은 성공인데 아무것도 안 남는다.
          # 경로별로 나누고, 실패는 무시하되 결과는 반드시 확인한다.
          for p in data docs; do
            [ -d "$p" ] && git add "$p"
          done
          git status --short
          if git diff --cached --quiet; then
            echo "스테이징된 변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "PDP data $(TZ=Asia/Seoul date +%F)"
          git push
