# Clarity 단독 워크플로.  GA4/카페24와 반드시 분리해서 돌린다.
#
# 이유: Clarity Export API는 "지금부터 과거 N일" 창으로만 응답한다(달력일 지정 불가).
#       KST 00:20에 돌려야 그 창이 방금 끝난 KST 달력일과 거의 일치해 GA4와 비교가 된다.
#       07:20에 돌리면 창이 7시간 밀려서 두 소스를 나란히 놓을 수 없다.
#
# 그리고 Clarity는 최근 3일치만 준다 — 하루 놓치면 그날 데이터는 영구 소실이다.
# 그래서 이 워크플로만 따로, 매일 확실히 돈다.
name: clarity daily

on:
  schedule:
    - cron: "20 15 * * *"     # 15:20 UTC = 00:20 KST  ← 본 실행
    # 재시도 2회. GitHub 예약 실행은 지연되거나 아예 실패한다 —
    # 2026-08-07 02:02 실행은 "job was not acquired by Runner" 로 죽었고,
    # Clarity 는 3일 뒤 영구 소실이라 놓치면 복구가 안 된다.
    # --only-if-stale-hours 가드 덕분에 본 실행이 성공했으면 이 둘은 호출 없이 끝난다.
    - cron: "20 18 * * *"     # 03:20 KST
    - cron: "20 21 * * *"     # 06:20 KST — pdp daily(07:20)와 겹치지 않게 앞당김
  workflow_dispatch:

concurrency:
  group: clarity-daily
  cancel-in-progress: false   # 적재는 중간에 끊으면 안 된다

# 이 워크플로는 수집 결과를 저장소에 커밋한다. 신규 저장소의 GITHUB_TOKEN 기본값이
# 읽기 전용인 경우가 있어, 명시하지 않으면 마지막 push 단계에서 403으로 죽는다.
permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect Clarity snapshots
        env:
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
        # 6시간 안에 이미 받았으면 호출하지 않는다. 하루 10회 예산을 재시도가
        # 태워버리면 정작 사람이 수동 조회할 몫이 없어진다.
        # 건너뛴 경우를 커밋 단계가 실패로 오인하지 않도록 표시를 남긴다.
        run: |
          out=$(python fetch_clarity_pdp.py --only-if-stale-hours 6 | tee /dev/stderr)
          if echo "$out" | grep -q "아직 최신이라 건너뜁니다"; then
            echo "skipped=true" >> "$GITHUB_ENV"
          fi

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/clarity_snapshots.json data/clarity_call_budget.json
          git status --short
          # Clarity 는 append-only 라 커밋 실패 = 그날 데이터 영구 소실이다.
          # 조용히 지나가지 않도록 상태를 찍고 분기를 명시한다.
          if git diff --cached --quiet; then
            if [ "${skipped:-}" = "true" ]; then
              echo "이미 최신이라 수집을 건너뛰었다 — 변경 없음이 정상"
            else
              echo "::warning::수집했는데 변경이 없다. 적재 실패 가능성이 있으니 로그 확인"
            fi
            exit 0
          fi
          git commit -m "Clarity snapshot $(TZ=Asia/Seoul date +%F)"
          # 다른 워크플로가 먼저 push 하면 거부된다. 실제로 2026-08-10 07:53 실행이
          # 07:52 의 pdp daily 와 부딪혀 그날 Clarity 수집분이 통째로 날아갔다.
          # Clarity 는 3일 뒤 영구 소실이라 push 실패를 그냥 두면 안 된다.
          for i in 1 2 3 4 5; do
            if git push; then echo "push 성공 ($i회차)"; exit 0; fi
            echo "push 거부 — 원격을 받아 다시 얹는다 ($i/5)"
            git pull --rebase --autostash origin master || true
            sleep $((i * 5))
          done
          echo "::error::5회 시도했으나 push 실패. Clarity 데이터가 유실될 수 있다"
          exit 1
